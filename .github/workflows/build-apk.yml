name: Build APK

on:
  # Run on every push to main/master
  push:
    branches: [main, master]
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Gradle) ───────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Set up Flutter ─────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # ── 4. Get dependencies ───────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 5. Run analyzer (fail the build if there are errors) ──────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings

      # ── 6. Build DEBUG APK ────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # ── 7. Upload debug APK as artifact ───────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── 8. Build RELEASE APK (unsigned, for testing) ──────────────────────
      - name: Build release APK (unsigned)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # ── 9. Upload release APK as artifact ─────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
