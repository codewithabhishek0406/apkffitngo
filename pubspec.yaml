name: fitngo
description: FitNGo — Food Nutrition Database app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^13.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3+1

  # Local storage
  hive_flutter: ^1.1.0

  # Images
  cached_network_image: ^3.3.1

  # Barcode scanner
  mobile_scanner: ^5.1.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # Fonts (downloads Inter at build-time — no .ttf files needed)
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
